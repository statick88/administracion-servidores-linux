name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - '**.qmd'
      - '_quarto.yml'
      - 'anexos/**'
      - 'unidades/**'
      - 'presentaciones/**'
      - 'images/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: ["main"]
    paths:
      - '**.qmd'
      - '_quarto.yml'
      - 'anexos/**'
      - 'unidades/**'
      - 'presentaciones/**'
      - 'images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Jupyter
        run: pip install jupyter

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.6.42'

      - name: Render Quarto (HTML only)
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
