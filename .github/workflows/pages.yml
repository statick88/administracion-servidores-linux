name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'site/**'
      - 'tools/**'
      - 'course/**'
      - 'quizzes/**'
      - '01-fundamentos/**'
      - '02-paquetes/**'
      - '03-scripting/**'
      - '04-usuarios/**'
      - '05-procesos/**'
      - '06-redes/**'
      - '07-seguridad/**'
      - '08-docker/**'
      - '09-nginx/**'
      - '10-ssl/**'
      - '11-bases-datos/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'site/**'
      - 'tools/**'
      - 'course/**'
      - 'quizzes/**'
      - '01-fundamentos/**'
      - '02-paquetes/**'
      - '03-scripting/**'
      - '04-usuarios/**'
      - '05-procesos/**'
      - '06-redes/**'
      - '07-seguridad/**'
      - '08-docker/**'
      - '09-nginx/**'
      - '10-ssl/**'
      - '11-bases-datos/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run site tests
        run: node --test site/*.test.mjs tests/*.test.mjs

      - name: Build site
        run: python3 tools/build_site.py --output _site

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
